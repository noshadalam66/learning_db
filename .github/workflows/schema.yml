name: schema

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # migrate.sh no longer issues CREATE DATABASE - shared hosting does
          # not allow it - so the service container creates it instead.
          MYSQL_DATABASE: learning
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: learning

    steps:
      - uses: actions/checkout@v4

      - name: Install the MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Confirm CHECK constraints are enforced
        # MySQL parsed and silently ignored CHECK before 8.0.16, which is worse
        # than not supporting it. Fail loudly rather than pass a suite whose
        # constraint tests are all no-ops.
        run: |
          version=$(mysql -h127.0.0.1 -uroot -proot -N -B -e "SELECT VERSION()")
          echo "MySQL $version"
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE probe;
            CREATE TABLE probe.t (n INT CHECK (n > 0));"
          if mysql -h127.0.0.1 -uroot -proot -e "INSERT INTO probe.t VALUES (-1)" 2>/dev/null; then
            echo "CHECK constraints are NOT enforced - MySQL 8.0.16+ is required" >&2
            exit 1
          fi
          mysql -h127.0.0.1 -uroot -proot -e "DROP DATABASE probe"

      - name: Apply migrations
        run: ./scripts/migrate.sh

      - name: Migrations are idempotent
        run: ./scripts/migrate.sh | grep -q 'Done. 0 migration(s) applied.'

      - name: An edited migration is refused
        run: |
          echo "-- tamper" >> migrations/0002_identity.sql
          if ./scripts/migrate.sh; then
            echo "the runner accepted a changed migration" >&2
            exit 1
          fi
          git checkout migrations/0002_identity.sql

      - name: Load seed data
        run: ./scripts/seed.sh

      - name: Seeds are idempotent
        run: ./scripts/seed.sh

      - name: Verify
        run: ./scripts/verify.sh

      - name: install.sql installs from any starting state
        # The file a cPanel user actually imports, which for a long time
        # nothing here touched: the steps above run migrate.sh and seed.sh
        # instead, so three bugs in install.sql reached a real server.
        #
        # The one this step exists for is the state a person is actually in
        # when they import it: the LAST import failed and left a database full
        # of half-made tables. install.sql has to fix that, because that is
        # when it is needed most - so it drops everything it is about to
        # create, and the cases below are the states it has to survive.
        #
        # A second database, so none of this can disturb the one verified above.
        env:
          MYSQL_DATABASE: install_probe
        run: |
          set -euo pipefail
          my() { mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 "$@"; }
          count() { my -N -B install_probe -e "$1"; }

          ./scripts/build-install-sql.sh
          my -e "CREATE DATABASE install_probe CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci"

          echo "--- into an empty database"
          my install_probe < dist/install.sql
          courses=$(count "SELECT COUNT(*) FROM catalog_courses")
          routines=$(count "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema='install_probe'")

          # Counted from the migrations, not written down. The first version of
          # this assertion hard-coded 11 and went red the moment 0012 added the
          # three quiet procedures - a number in a test is a number that goes
          # stale, same as one in a comment.
          expected=$(grep -hoE '^CREATE (PROCEDURE|FUNCTION) [a-z_]+' migrations/*.sql | awk '{print $3}' | sort -u | wc -l)

          # Counted from the seeds, not written down. This said 15 for months
          # after the Data Science track took the catalogue to 20, and CI had
          # been red on it ever since - which is the same lesson the routine
          # count above already learned the hard way, in a comment three lines
          # from the number that went stale.
          #
          # A course row is the only VALUES row that opens with a course id, and
          # the id prefixes are a convention this schema has kept since 0001.
          seeded_courses=$(grep -hoE "^\s*\('c[0-9a-f]{7}-[0-9a-f-]+'," seeds/*.sql \
            | grep -oE "c[0-9a-f-]+" | sort -u | wc -l)
          [ "$seeded_courses" -gt 0 ] || { echo "::error::no course ids found in seeds/ - this derivation has stopped working"; exit 1; }

          echo "courses=$courses routines=$routines (expected $expected) seeded=$seeded_courses"
          [ "$courses" -eq "$seeded_courses" ] || { echo "::error::expected $seeded_courses courses, got $courses"; exit 1; }
          [ "$routines" -eq "$expected" ] || { echo "::error::expected $expected routines, got $routines"; exit 1; }
          ./scripts/verify.sh

          echo "--- over the database it just installed"
          my install_probe < dist/install.sql
          courses=$(count "SELECT COUNT(*) FROM catalog_courses")
          tables=$(count "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='install_probe' AND table_type='BASE TABLE'")
          [ "$courses" -eq "$seeded_courses" ] || { echo "::error::re-import produced $courses courses"; exit 1; }
          echo "courses=$courses tables=$tables"
          ./scripts/verify.sh

          echo "--- over the wreckage of an import that stopped halfway"
          # Some tables gone, some still there, every stored routine left
          # behind - a table-drop does not take them with it, which is what
          # used to stop the next import with "#1304 PROCEDURE ... already
          # exists" before this file dropped them itself.
          my install_probe -e "SET FOREIGN_KEY_CHECKS=0;
            DROP TABLE search_documents, analytics_events, catalog_lessons, progress_enrolments;
            SET FOREIGN_KEY_CHECKS=1;"
          left=$(count "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema='install_probe'")
          [ "$left" -gt 0 ] || { echo "::error::nothing left behind - this case is no longer testing anything"; exit 1; }
          echo "routines left behind by the table-drop: $left"

          my install_probe < dist/install.sql
          courses=$(count "SELECT COUNT(*) FROM catalog_courses")
          [ "$courses" -eq "$seeded_courses" ] || { echo "::error::import over wreckage produced $courses courses"; exit 1; }
          ./scripts/verify.sh

          echo "--- a database with a real account is refused, and keeps its data"
          # The one thing that stops this file. Every seeded account is
          # @learning.test; anything else is somebody who registered through
          # the site, and their database must not be replaced by the seeds.
          my install_probe -e "INSERT INTO identity_users (id, email, password_hash, full_name, status)
            VALUES ('99999999-9999-4999-8999-999999999999','someone@example.com','x','A Real Learner','active')"

          if my install_probe < dist/install.sql 2>/tmp/refused; then
            echo "::error::install.sql ran against a database with a real account in it"
            exit 1
          fi
          grep -q "install.sql REPLACES this database" /tmp/refused || {
            echo "::error::refused, but not with the message that says what to do:"
            cat /tmp/refused
            exit 1
          }
          still=$(count "SELECT COUNT(*) FROM catalog_courses")
          real=$(count "SELECT COUNT(*) FROM identity_users WHERE email='someone@example.com'")
          [ "$still" -eq "$seeded_courses" ] || { echo "::error::the refusal destroyed data: $still courses left"; exit 1; }
          [ "$real" -eq 1 ] || { echo "::error::the refusal deleted the account it was protecting"; exit 1; }

      - name: install.sql into a latin1 database, the way cPanel makes one
        # Not one CREATE TABLE in migrations/ names a character set, so every
        # text column inherits the DATABASE default - and every database in
        # every step above was created utf8mb4 by this workflow. cPanel's
        # control panel creates them latin1.
        #
        # So the schema built perfectly on a real server and then stopped 275
        # statements in, on a Python lesson that prints CJK:
        #
        #   #1366 Incorrect string value: '\xE4\xB8\x96\xE7\x95\x8C...'
        #          for column `...`.`content_articles`.`body` at row 1
        #
        # This step is that database. Through mysqli, because that combination
        # - latin1 database, phpMyAdmin import - is the one that actually
        # happens.
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: latin1_probe
        run: |
          set -euo pipefail
          my() { mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 "$@"; }
          count() { my -N -B latin1_probe -e "$1"; }

          ./scripts/build-install-sql.sh
          my -e "DROP DATABASE IF EXISTS latin1_probe;
                 CREATE DATABASE latin1_probe CHARACTER SET latin1 COLLATE latin1_swedish_ci"

          php tests/import-as-phpmyadmin.php dist/install.sql latin1_probe

          # The bytes, not the rendering. A latin1 connection would have stored
          # these double-encoded and every string comparison would still have
          # looked right in a terminal.
          courses=$(count "SELECT COUNT(*) FROM catalog_courses")
          cjk=$(count "SELECT COUNT(*) FROM content_articles WHERE HEX(body) LIKE '%E4B896E7958C%'")
          emoji=$(count "SELECT COUNT(*) FROM content_articles WHERE HEX(body) LIKE '%F09F918D%'")
          # Double-encoding, counted rather than forbidden.
          #
          # This asked for zero rows containing the byte pair that opens a
          # double-encoded character, which was right until a lesson taught
          # mojibake by printing some: the Python course prints "cafÃ©" to show
          # what decoding UTF-8 as latin-1 does to a word, and the check read
          # that deliberate example as a corrupted import.
          #
          # So it now compares what is in the database with what the seeds
          # wrote. Equal means every mangled character was authored as one. A
          # real double-encoding mangles EVERY non-ASCII character in every
          # row, so the stored count would be in the thousands against a
          # handful in the source - this catches that far more clearly than a
          # zero ever did, and it does not go stale the next time a lesson
          # needs to show what broken text looks like.
          authored=$(grep -o 'Ã' seeds/*.sql | wc -l)
          doubled=$(count "SELECT COALESCE(SUM(CHAR_LENGTH(body) - CHAR_LENGTH(REPLACE(body, 'Ã', ''))), 0) FROM content_articles")

          # Counted from the seeds, not written down. This said 15 for months
          # after the Data Science track took the catalogue to 20, and CI had
          # been red on it ever since - which is the same lesson the routine
          # count above already learned the hard way, in a comment three lines
          # from the number that went stale.
          #
          # A course row is the only VALUES row that opens with a course id, and
          # the id prefixes are a convention this schema has kept since 0001.
          seeded_courses=$(grep -hoE "^\s*\('c[0-9a-f]{7}-[0-9a-f-]+'," seeds/*.sql \
            | grep -oE "c[0-9a-f-]+" | sort -u | wc -l)
          [ "$seeded_courses" -gt 0 ] || { echo "::error::no course ids found in seeds/ - this derivation has stopped working"; exit 1; }

          echo "courses=$courses cjk=$cjk emoji=$emoji mangled=$doubled (authored $authored) seeded=$seeded_courses"
          [ "$courses" -eq "$seeded_courses" ] || { echo "::error::latin1 install produced $courses courses"; exit 1; }
          # These two look for specific characters in specific seeds, so a
          # course rewrite can delete the thing being tested and leave the test
          # looking like a charset regression. It has happened once: the Python
          # course carried 世界 until it was rewritten, and this step went red
          # for weeks on a bug that did not exist. The messages name where the
          # characters live, so the next person reads "put it back" rather than
          # "the charset is broken".
          [ "$cjk" -ge 1 ] || { echo "::error::no CJK found in any article body - the charset canary is 世界 in the HTML course's charset lesson (seeds/0006). If a rewrite removed it, put it back; this is the only thing proving a cPanel-style latin1 database stores UTF-8 rather than mangling it"; exit 1; }
          [ "$emoji" -ge 1 ] || { echo "::error::no 4-byte emoji found in any article body - the canary is 👍 in seeds/0020_dart_course.sql. Four-byte characters are what utf8 (3-byte) silently truncates and utf8mb4 does not, so this is a different test from the one above"; exit 1; }
          [ "$doubled" -eq "$authored" ] || { echo "::error::the database holds $doubled mangled character(s) and the seeds authored $authored - the import double-encoded UTF-8"; exit 1; }

          # verify.sh includes the column-charset check, which is what fails
          # when this regresses: it names every column that cannot hold utf8mb4.
          ./scripts/verify.sh

      - name: install.sql and content.sql import through phpMyAdmin
        # Every step above uses the mysql client, which is how a developer
        # loads this schema and is not how it is installed on shared hosting.
        # The client drains the result sets a CALL leaves behind; mysqli, which
        # is what phpMyAdmin uses, does not - so a procedure ending in a bare
        # SELECT imports fine here and dies there with
        #
        #   #2014 - Commands out of sync; you can't run this command now
        #
        # That reached a real cPanel import twice, past a green CI. This step
        # drives both files through mysqli exactly as phpMyAdmin does.
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
        run: |
          set -euo pipefail
          my() { mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 "$@"; }

          my -e "DROP DATABASE IF EXISTS pma_probe; CREATE DATABASE pma_probe CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci"

          echo "--- install.sql, into an empty database"
          ./scripts/build-install-sql.sh
          php tests/import-as-phpmyadmin.php dist/install.sql pma_probe

          courses=$(my -N -B pma_probe -e "SELECT COUNT(*) FROM catalog_courses")

          # Counted from the seeds, not written down. This said 15 for months
          # after the Data Science track took the catalogue to 20, and CI had
          # been red on it ever since - which is the same lesson the routine
          # count above already learned the hard way, in a comment three lines
          # from the number that went stale.
          #
          # A course row is the only VALUES row that opens with a course id, and
          # the id prefixes are a convention this schema has kept since 0001.
          seeded_courses=$(grep -hoE "^\s*\('c[0-9a-f]{7}-[0-9a-f-]+'," seeds/*.sql \
            | grep -oE "c[0-9a-f-]+" | sort -u | wc -l)
          [ "$seeded_courses" -gt 0 ] || { echo "::error::no course ids found in seeds/ - this derivation has stopped working"; exit 1; }

          [ "$courses" -eq "$seeded_courses" ] || { echo "::error::phpMyAdmin import produced $courses courses, expected $seeded_courses"; exit 1; }

          echo "--- content.sql, over the database that import just created"
          ./scripts/build-content-sql.sh
          php tests/import-as-phpmyadmin.php dist/content.sql pma_probe

          MYSQL_DATABASE=pma_probe ./scripts/verify.sh
