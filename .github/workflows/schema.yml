name: schema

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # migrate.sh no longer issues CREATE DATABASE - shared hosting does
          # not allow it - so the service container creates it instead.
          MYSQL_DATABASE: learning
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: learning

    steps:
      - uses: actions/checkout@v4

      - name: Install the MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Confirm CHECK constraints are enforced
        # MySQL parsed and silently ignored CHECK before 8.0.16, which is worse
        # than not supporting it. Fail loudly rather than pass a suite whose
        # constraint tests are all no-ops.
        run: |
          version=$(mysql -h127.0.0.1 -uroot -proot -N -B -e "SELECT VERSION()")
          echo "MySQL $version"
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE probe;
            CREATE TABLE probe.t (n INT CHECK (n > 0));"
          if mysql -h127.0.0.1 -uroot -proot -e "INSERT INTO probe.t VALUES (-1)" 2>/dev/null; then
            echo "CHECK constraints are NOT enforced - MySQL 8.0.16+ is required" >&2
            exit 1
          fi
          mysql -h127.0.0.1 -uroot -proot -e "DROP DATABASE probe"

      - name: Apply migrations
        run: ./scripts/migrate.sh

      - name: Migrations are idempotent
        run: ./scripts/migrate.sh | grep -q 'Done. 0 migration(s) applied.'

      - name: An edited migration is refused
        run: |
          echo "-- tamper" >> migrations/0002_identity.sql
          if ./scripts/migrate.sh; then
            echo "the runner accepted a changed migration" >&2
            exit 1
          fi
          git checkout migrations/0002_identity.sql

      - name: Load seed data
        run: ./scripts/seed.sh

      - name: Seeds are idempotent
        run: ./scripts/seed.sh

      - name: Verify
        run: ./scripts/verify.sh

      - name: install.sql imports into an empty database, twice over
        # The file a cPanel user actually imports, which until now nothing here
        # touched: the steps above run migrate.sh and seed.sh instead, so two
        # bugs in install.sql reached a real server. The second was a leftover
        # stored routine surviving a table-drop, which is what the last third of
        # this step reproduces.
        #
        # A second database, so none of this can disturb the one verified above.
        env:
          MYSQL_DATABASE: install_probe
        run: |
          set -euo pipefail
          my() { mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 "$@"; }
          count() { my -N -B install_probe -e "$1"; }

          ./scripts/build-install-sql.sh
          my -e "CREATE DATABASE install_probe CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci"

          echo "--- into an empty database"
          my install_probe < dist/install.sql
          courses=$(count "SELECT COUNT(*) FROM catalog_courses")
          routines=$(count "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema='install_probe'")
          echo "courses=$courses routines=$routines"
          [ "$courses" -eq 15 ] || { echo "::error::expected 15 courses, got $courses"; exit 1; }
          [ "$routines" -eq 11 ] || { echo "::error::expected 11 routines, got $routines"; exit 1; }
          ./scripts/verify.sh

          echo "--- a database that still has tables is refused, and keeps its data"
          if my install_probe < dist/install.sql 2>/tmp/refused; then
            echo "::error::install.sql ran against a database that still had tables"
            exit 1
          fi
          grep -q "install.sql needs an EMPTY database" /tmp/refused || {
            echo "::error::refused, but not with the message that says what to do:"
            cat /tmp/refused
            exit 1
          }
          still=$(count "SELECT COUNT(*) FROM catalog_courses")
          [ "$still" -eq 15 ] || { echo "::error::the refusal destroyed data: $still courses left"; exit 1; }

          echo "--- drop every table and import again; the routines survive a table-drop"
          tables=$(count "SELECT GROUP_CONCAT(CONCAT('\`',table_name,'\`')) FROM information_schema.tables WHERE table_schema='install_probe' AND table_type='BASE TABLE'")
          my install_probe -e "SET FOREIGN_KEY_CHECKS=0; DROP TABLE $tables; SET FOREIGN_KEY_CHECKS=1;"
          left=$(count "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema='install_probe'")
          echo "routines left behind by the table-drop: $left"
          [ "$left" -gt 0 ] || { echo "::error::nothing left behind - this step is no longer testing anything"; exit 1; }

          my install_probe < dist/install.sql
          courses=$(count "SELECT COUNT(*) FROM catalog_courses")
          [ "$courses" -eq 15 ] || { echo "::error::re-import produced $courses courses"; exit 1; }
          ./scripts/verify.sh

      - name: install.sql and content.sql import through phpMyAdmin
        # Every step above uses the mysql client, which is how a developer
        # loads this schema and is not how it is installed on shared hosting.
        # The client drains the result sets a CALL leaves behind; mysqli, which
        # is what phpMyAdmin uses, does not - so a procedure ending in a bare
        # SELECT imports fine here and dies there with
        #
        #   #2014 - Commands out of sync; you can't run this command now
        #
        # That reached a real cPanel import twice, past a green CI. This step
        # drives both files through mysqli exactly as phpMyAdmin does.
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
        run: |
          set -euo pipefail
          my() { mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 "$@"; }

          my -e "DROP DATABASE IF EXISTS pma_probe; CREATE DATABASE pma_probe CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci"

          echo "--- install.sql, into an empty database"
          ./scripts/build-install-sql.sh
          php tests/import-as-phpmyadmin.php dist/install.sql pma_probe

          courses=$(my -N -B pma_probe -e "SELECT COUNT(*) FROM catalog_courses")
          [ "$courses" -eq 15 ] || { echo "::error::phpMyAdmin import produced $courses courses"; exit 1; }

          echo "--- content.sql, over the database that import just created"
          ./scripts/build-content-sql.sh
          php tests/import-as-phpmyadmin.php dist/content.sql pma_probe

          MYSQL_DATABASE=pma_probe ./scripts/verify.sh
