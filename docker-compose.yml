# ---------------------------------------------------------------------------
# Local PostgreSQL for the learning platform.
#
#   docker compose up -d
#   ./scripts/migrate.sh && ./scripts/seed.sh
#
# Everything in migrations/ is also mounted into the image's init directory, so
# a container starting against an empty volume brings itself up migrated. The
# scripts are still the supported path - the mount is a convenience.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    container_name: learning_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-learning}
      POSTGRES_USER: ${PGUSER:-learning}
      POSTGRES_PASSWORD: ${PGPASSWORD:-learning}
      # Deterministic collation so ORDER BY does not shift between machines.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-learning} -d ${PGDATABASE:-learning}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional web client on http://localhost:8081 - `docker compose --profile tools up`
  adminer:
    image: adminer:4
    container_name: learning_db_adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
